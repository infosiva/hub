<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeadScout</title>
<style>
:root{--bg:#0b1411;--panel:#101d18;--panel2:#142620;--line:#24382f;--ink:#e9f5ee;--mute:#9bb3a6;--a:#34d399;--b:#38bdf8;--warn:#fbbf24;--bad:#fb7185;--r:14px;--ease:cubic-bezier(.16,1,.3,1)}
@media (prefers-color-scheme:light){:root{--bg:#f3f7f4;--panel:#fff;--panel2:#eef5f0;--line:#d3e2d9;--ink:#10231a;--mute:#4a665a;--a:#059669;--b:#0369a1;--warn:#92400e;--bad:#be123c}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;position:relative}
::selection{background:var(--a);color:#04130c}
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;background:radial-gradient(40% 35% at 20% 25%,color-mix(in srgb,var(--a) 26%,transparent),transparent 70%),radial-gradient(35% 40% at 80% 20%,color-mix(in srgb,var(--b) 22%,transparent),transparent 70%),radial-gradient(45% 40% at 60% 90%,color-mix(in srgb,var(--a) 14%,transparent),transparent 70%);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(4%,3%,0) scale(1.08)}}
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-columns:340px 1fr;gap:14px;padding:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-height:0;box-shadow:0 12px 32px -16px rgba(0,0,0,.5)}
aside{padding:18px;display:flex;flex-direction:column;gap:12px;overflow:auto}
h1{margin:0;font-size:26px;letter-spacing:-.02em;font-weight:750;text-wrap:balance}
h1 span{color:var(--a)}
.sub{color:var(--mute);font-size:13px;margin:4px 0 0}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
input[type=text],input[type=number]{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:0 12px;font:inherit}
input::placeholder{color:var(--mute)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;min-height:44px;cursor:pointer;color:var(--ink);margin:0}
.chk input{width:20px;height:20px;accent-color:var(--a)}
.cost{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.cost b{font-size:22px;color:var(--a);font-variant-numeric:tabular-nums}
.btn{height:48px;border:0;border-radius:12px;font:600 15px ui-sans-serif,system-ui,sans-serif;color:#04130c;background:linear-gradient(90deg,var(--a),var(--b));cursor:pointer;transition:transform .15s var(--ease),filter .15s;box-shadow:0 8px 20px -10px var(--a)}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn:hover:not([disabled]){filter:brightness(1.08);transform:translateY(-1px)}.btn:active:not([disabled]){transform:scale(.98)}.btn:focus-visible{outline:3px solid var(--b);outline-offset:3px}.btn.busy[disabled]{opacity:1;cursor:progress}.btn.busy{position:relative;background-size:200% 100%;animation:sh 1.2s linear infinite;opacity:1;cursor:progress}.btn.busy::before{content:'';display:inline-block;width:14px;height:14px;margin-right:8px;vertical-align:-2px;border:2px solid #04130c55;border-top-color:#04130c;border-radius:50%;animation:sp .7s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}@keyframes sh{to{background-position:-200% 0}}@media(prefers-reduced-motion:reduce){.btn.busy,.btn.busy::before{animation:none}}.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none;height:44px;padding:0 16px;display:inline-flex;align-items:center;text-decoration:none;border-radius:12px;font-weight:600}
.msg{font-size:13px;color:var(--bad);min-height:18px}
main{display:flex;flex-direction:column;padding:16px;gap:12px;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .15s var(--ease),border-color .15s}
.chip:active{transform:scale(.96)}
.chip[aria-pressed=true]{border-color:var(--a);box-shadow:inset 0 0 0 1px var(--a)}
.chip b{font-variant-numeric:tabular-nums}
.dot{width:9px;height:9px;border-radius:50%}
.weak .dot{background:var(--bad)}.none .dot{background:var(--warn)}.ok .dot{background:var(--a)}.unknown .dot{background:var(--mute)}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .6s var(--ease)}
.stage{font-size:13px;color:var(--mute);margin-top:6px}
.table{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:12px;display:flex;scrollbar-color:var(--line) transparent}
table{border-collapse:collapse;width:100%;font-size:13px;align-self:flex-start}
th{position:sticky;top:0;background:var(--panel2);text-align:left;padding:10px;color:var(--mute);font-weight:600;white-space:nowrap}
td{padding:10px;border-top:1px solid var(--line);vertical-align:top;font-variant-numeric:tabular-nums}
tr.in{animation:in .4s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.pill{padding:3px 9px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.weak{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.none{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.unknown{background:color-mix(in srgb,var(--mute) 18%,transparent);color:var(--mute)}
.pill.ok{background:color-mix(in srgb,var(--a) 18%,transparent);color:var(--a)}
.why{color:var(--mute);font-size:12px}
a{color:var(--b)}
.empty{margin:auto;text-align:center;color:var(--mute);max-width:340px;padding:20px}
.demo{display:flex;gap:10px;justify-content:center;margin-bottom:14px}
.demo i{width:72px;height:116px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(var(--panel2),var(--panel));position:relative;overflow:hidden}
.demo i::after{content:"";position:absolute;left:0;right:0;height:30%;top:-30%;background:linear-gradient(transparent,color-mix(in srgb,var(--a) 50%,transparent),transparent);animation:scan 2.4s ease-in-out infinite}
.demo i:nth-child(2)::after{animation-delay:.6s}.demo i:nth-child(3)::after{animation-delay:1.2s}
@keyframes scan{to{top:100%}}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);z-index:5;background:var(--panel);border-left:1px solid var(--line);box-shadow:-20px 0 40px -20px rgba(0,0,0,.6);transform:translateX(105%);transition:transform .35s var(--ease);display:flex;flex-direction:column;visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:18px;letter-spacing:-.01em;text-wrap:balance}
.db{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
dl{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;margin:0;font-size:13px}
dt{color:var(--mute)}dd{margin:0;overflow-wrap:anywhere}
.shot{width:100%;max-height:300px;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:10px}
textarea{width:100%;min-height:210px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:10px 12px;font:inherit;resize:vertical}
textarea:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.acts .ghost,.acts .btn{height:44px;padding:0 14px;font-size:14px}
tbody tr[tabindex]{cursor:pointer}tbody tr[tabindex]:hover td{background:color-mix(in srgb,var(--a) 7%,transparent)}
tbody tr[tabindex]:focus-visible{outline:2px solid var(--b);outline-offset:-2px}
@media (max-width:820px){.sub{display:none}.app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);height:100dvh;padding:10px;gap:10px}aside{padding:12px;gap:8px;max-height:46dvh}#go{position:sticky;bottom:0;flex-shrink:0;box-shadow:0 -8px 12px -6px rgba(255,255,255,.9)}main{padding:12px;min-height:0}.table{flex:1;min-height:0;max-height:none;overflow:auto}}
@media (prefers-reduced-motion:reduce){*,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="app">
 <aside class="card">
  <div><h1>Lead<span>Scout</span></h1><p class="sub">Find local businesses, then grade their websites on a phone.</p></div>
  <div><label for="niche">Business type</label><input id="niche" type="text" value="dentists"></div>
  <div><label for="loc">Location</label><input id="loc" type="text" value="Milton Keynes, UK"></div>
  <div><label for="me">Your name (for outreach)</label><input id="me" type="text" placeholder="e.g. Siva"></div>
  <div class="row">
   <div><label for="max">Max places</label><input id="max" type="number" min="1" max="200" value="100"></div>
   <label class="chk" for="skip"><input id="skip" type="checkbox" checked>Skip closed</label>
  </div>
  <label class="chk" for="free"><input id="free" type="checkbox" checked>Free mode (OpenStreetMap: no ratings, patchy data)</label>
  <div class="cost"><span id="cl">Estimated Apify cost</span><b id="cost">$0.50</b></div>
  <label class="chk" for="ok"><input id="ok" type="checkbox">I approve this spend</label>
  <button class="btn" id="go" disabled>Run search</button>
  <div class="msg" id="msg" role="alert"></div>
 </aside>
 <main class="card">
  <div class="top">
   <div class="chips">
    <button class="chip weak" data-f="weak" aria-pressed="true"><span class="dot"></span>Weak <b id="n-weak">0</b></button>
    <button class="chip none" data-f="none" aria-pressed="true"><span class="dot"></span>No site <b id="n-none">0</b></button>
    <button class="chip unknown" data-f="unknown" aria-pressed="true"><span class="dot"></span>Unknown <b id="n-unknown">0</b></button>
    <button class="chip ok" data-f="ok" aria-pressed="false"><span class="dot"></span>OK <b id="n-ok">0</b></button>
   </div>
   <a class="ghost" id="csv" href="#" style="display:none">Download CSV</a>
  </div>
  <div id="prog" style="display:none"><div class="bar"><i id="fill"></i></div><div class="stage" id="stage" aria-live="polite"></div></div>
  <div class="table" id="tw"><div class="empty"><div class="demo" aria-hidden="true"><i></i><i></i><i></i></div>Set a business type and location, pick free mode or approve the spend, and run. Each site is opened at 375px and graded weak, none or ok.</div></div>
 </main>
</div>
<aside class="drawer" id="dr" role="dialog" aria-modal="false" aria-labelledby="dn" aria-hidden="true">
 <div class="dh"><div><h2 id="dn"></h2><span id="dp"></span></div><button class="ghost" id="dx" aria-label="Close details">Close</button></div>
 <div class="db" id="dbody"></div>
</aside>
<script>
const API=location.pathname.startsWith('/leadscout')?'/api/leadscout':'/api';
const $=id=>document.getElementById(id);let rows=[],view=[],ctx={niche:'',loc:''},jobId=null,filt={weak:1,none:1,unknown:1,ok:0};
const mode=()=>{const f=$('free').checked;$('ok').closest('label').style.display=f?'none':'';$('go').disabled=f?false:!$('ok').checked;$('cl').textContent=f?'Cost (OpenStreetMap)':'Estimated Apify cost';if(f){$('cost').textContent='$0.00';$('msg').textContent=''}else upd()};
const upd=async()=>{if($('free').checked)return;try{const r=await(await fetch(`${API}/estimate?max=${$('max').value}&skip=${$('skip').checked?1:0}`)).json();$('cost').textContent='$'+r.usd.toFixed(2);if(!r.tokenSet)$('msg').textContent='APIFY_TOKEN missing in leadscout/.env'}catch{}};
try{$('me').value=localStorage.me||''}catch{}$('me').oninput=()=>{try{localStorage.me=$('me').value}catch{}};
['max','skip'].forEach(i=>$(i).addEventListener('input',upd));upd();
$('ok').onchange=()=>$('go').disabled=!$('ok').checked;$('free').onchange=mode;try{$('free').checked=localStorage.free!=='0';mode()}catch{}$('free').addEventListener('change',()=>{try{localStorage.free=$('free').checked?'1':'0'}catch{}});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{filt[c.dataset.f]^=1;c.setAttribute('aria-pressed',!!filt[c.dataset.f]);draw()});
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function draw(){
 for(const k of['weak','none','unknown','ok'])$('n-'+k).textContent=rows.filter(r=>r.site_status===k).length;
 if(!rows.length)return;
 const v=view=rows.filter(r=>filt[r.site_status]);
 $('tw').innerHTML=`<table><thead><tr><th>Status</th><th>Name</th><th>Rating</th><th>Phone</th><th>Website / why</th></tr></thead><tbody>${v.map((r,i)=>`<tr class="in" tabindex="0" data-i="${i}" style="animation-delay:${Math.min(i,12)*25}ms"><td><span class="pill ${r.site_status}">${r.site_status}</span></td><td><b>${esc(r.name)}</b><div class="why">${esc(r.address)}</div></td><td>${esc(r.rating)} <span class="why">(${esc(r.review_count)})</span></td><td>${esc(r.phone)}</td><td>${r.website?`<a href="${esc(r.website)}" target="_blank" rel="noopener">${esc(r.website.replace(/^https?:\/\/(www\.)?/,'').slice(0,34))}</a>`:'-'}<div class="why">${esc(r.reasons)}</div></td></tr>`).join('')}</tbody></table>`;
 $('tw').querySelectorAll('tbody tr').forEach(t=>{t.onclick=e=>{if(e.target.closest('a'))return;openD(+t.dataset.i)};t.onkeydown=e=>{if(e.key==='Enter')openD(+t.dataset.i)}})}
const waNum=p=>{let d=String(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d='44'+d.slice(1);return d.length>=10?d:''};
function pitch(r){
 const me=$('me').value.trim()||'[your name]',what=ctx.niche||'local businesses',where=ctx.loc||'your area';
 const why=String(r.reasons||'').split('; ').filter(Boolean);
 const body=r.site_status==='none'?`I was looking at ${what} in ${where} and could not find a website for ${r.name}. Customers searching on their phone will go to whoever they can find, so I would love to help get you online.`
  :`I was looking at ${what} in ${where} and checked ${r.name}'s website on a phone. What I noticed: ${why.slice(0,3).join(', ')||'it could be easier to use'}. These are quick to fix and would help more of your visitors book.`;
 return `Hi, ${body}\n\nWould you be open to a short chat this week? Happy to send a free example first.\n\n${me}`}
let lastF=null;
function openD(i){const r=view[i];if(!r)return;lastF=document.activeElement;
 $('dn').textContent=r.name;$('dp').innerHTML=`<span class="pill ${r.site_status}">${r.site_status}</span>`;
 const wa=waNum(r.phone),f=[['Category',r.category],['Address',r.address],['Phone',r.phone],['Rating',r.rating?`${r.rating} (${r.review_count} reviews)`:''],['Website',r.website?`<a href="${esc(r.website)}" target="_blank" rel="noopener">${esc(r.website)}</a>`:'none found',1],['Maps',r.maps_url?`<a href="${esc(r.maps_url)}" target="_blank" rel="noopener">Open in Google Maps</a>`:'',1],['Why graded',esc(String(r.reasons||'').split('; ').join(' / ')||'-'),1]];
 $('dbody').innerHTML=`${r.shot?`<img class="shot" alt="Website at 375px" src="${API}${r.shot}" onerror="this.remove()">`:''}<dl>${f.map(([k,v,h])=>`<dt>${k}</dt><dd>${h?v:esc(v||'-')}</dd>`).join('')}</dl>
 <div><label for="pt">Message (edit before sending)</label><textarea id="pt">${esc(pitch(r))}</textarea></div>
 <div class="acts"><button class="btn" id="cp">Copy message</button>${wa?`<a class="ghost" id="wa" target="_blank" rel="noopener" href="#">WhatsApp</a>`:''}${r.phone?`<a class="ghost" href="tel:${esc(r.phone.replace(/[^\d+]/g,''))}">Call</a>`:''}</div><div class="acts"><button class="btn" id="pb">Build proposal + email</button></div><div id="po"></div><div class="why">Nothing is sent from here. WhatsApp opens with the text ready; you press send. No email is collected by the scrape.</div>`;
 const wl=$('wa'),pt=$('pt');if(wl){const u=()=>wl.href=`https://wa.me/${wa}?text=${encodeURIComponent(pt.value)}`;u();pt.oninput=u}
 $('cp').onclick=async()=>{try{await navigator.clipboard.writeText(pt.value);$('cp').textContent='Copied'}catch{pt.select();$('cp').textContent='Select + copy'}setTimeout(()=>$('cp').textContent='Copy message',1500)};
 $('pb').onclick=()=>prop(rows.indexOf(r));
 $('dr').classList.add('open');$('dr').setAttribute('aria-hidden','false');$('dx').focus()}
async function prop(i){const b=$('pb');b.disabled=true;b.textContent='Building (about 30s)…';
 try{const r=await fetch(API+'/proposal',{method:'POST',body:JSON.stringify({job:jobId,idx:i})}),o=await r.json();if(!r.ok)throw new Error(o.error);
  const e=o.email,v=o.validation,c=o.company;
  $('po').innerHTML=`<dl><dt>Checks</dt><dd>${v.checks.map(k=>`${k.ok===null?'?':k.ok?'✓':'✗'} ${esc(k.k)}`).join('<br>')||'nothing to check (no site found)'}</dd><dt>Confidence</dt><dd>${Math.round(v.confidence*100)}%</dd><dt>Company</dt><dd>${esc(c.status)}${c.legalName?' · '+esc(c.legalName):''}${c.note?' · '+esc(c.note):''}</dd></dl>
  <div class="acts"><a class="ghost" target="_blank" rel="noopener" href="${API}${o.url}">Open proposal</a><a class="ghost" href="${API}${o.url}?dl=1">Download</a></div>
  ${e.allowed?`<label for="es">Subject</label><input id="es" value="${esc(e.subject)}"><label for="eb">Email (edit before sending)</label><textarea id="eb">${esc(e.body)}</textarea><div class="acts"><button class="btn" id="ec">Copy email</button></div>`:`<div class="why">${esc(e.reason)}</div>`}`;
  const ec=$('ec');if(ec)ec.onclick=async()=>{try{await navigator.clipboard.writeText($('es').value+'\n\n'+$('eb').value);ec.textContent='Copied'}catch{$('eb').select()}};
  $('po').scrollIntoView({block:'nearest',behavior:'smooth'});b.textContent='Rebuild proposal'}catch(x){$('po').innerHTML=`<div class="why">${esc(x.message)}</div>`;b.textContent='Build proposal + email'}b.disabled=false}
function closeD(){$('dr').classList.remove('open');$('dr').setAttribute('aria-hidden','true');lastF&&lastF.focus()}
$('dx').onclick=closeD;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('dr').classList.contains('open'))closeD()});
$('go').onclick=async()=>{
 $('msg').textContent='';$('go').disabled=true;$('go').classList.add('busy');$('go').textContent='Searching…';ctx={niche:$('niche').value,loc:$('loc').value};
 const r=await fetch(API+'/run',{method:'POST',body:JSON.stringify({niche:$('niche').value,location:$('loc').value,max:+$('max').value,skipClosed:$('skip').checked,confirm:$('ok').checked,free:$('free').checked})});
 const j=await r.json();if(!r.ok){$('msg').textContent=j.error;idle();return}
 jobId=j.id;$('prog').style.display='block';if(innerWidth<=820)$('prog').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'});$('csv').style.display='none';poll()};
const LBL={queued:'Starting',scraping:'Finding businesses',grading:'Opening each website at 375px',done:'Done'};
const idle=()=>{const b=$('go');b.classList.remove('busy');b.textContent='Run search';b.disabled=$('free').checked?false:!$('ok').checked};
async function poll(){
 let j;try{const r=await fetch(API+'/job/'+jobId);j=r.ok?await r.json():null}catch{j=null}
 if(!j||!j.stage){$('msg').textContent='Lost the job (server restarted?). Run the search again.';$('prog').style.display='none';idle();return}
 $('fill').style.width=(j.pct||0)+'%';$('stage').textContent=(LBL[j.stage]||j.stage)+(j.total?` (${j.done||0}/${j.total} sites)`:'')+(j.source?` · source: ${j.source}`:'');
 if(j.error){$('msg').textContent=j.error;$('ok').checked=false;idle();return}
 if(j.stage==='done'){rows=j.rows;$('csv').href=`${API}/job/${jobId}/csv`;$('csv').style.display='inline-flex';$('ok').checked=false;draw();idle();return}
 setTimeout(poll,1500)}
</script>
</body>
</html>
